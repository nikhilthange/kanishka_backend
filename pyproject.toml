[project]
name = "kanishka-ai-task-manager"
version = "1.0.0"
description = "AI-Powered Task Management System with FastAPI, JWT, RBAC, PostgreSQL/MySQL, Alembic migrations, and LLM integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kanishka Software Assessment Candidate" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "email-validator>=2.1.1,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "cryptography>=42.0.5",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "bcrypt>=4.0.1,<4.1.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-generativeai>=0.4.1,<1.0.0",
    "openai>=1.14.0,<2.0.0",
    "anthropic>=0.18.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2,<9.0.0",
    "pytest-asyncio>=0.23.5,<1.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
